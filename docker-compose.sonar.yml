# SonarQube Community para analizar el código fuente del monorepo (guía: docs/sonarqube.md).
# Va aparte de docker-compose.yml: no forma parte de la plataforma y no se necesita para correrla.
#   Arrancar:  make sonar-up      Analizar:  make sonar      Apagar:  make sonar-down
# Tiene su propia base de datos, separada de la del proyecto (ADR-1): nada de Sonar toca admin_schema ni app_schema.
name: master-code-sonar

services:
  sonar-db:
    image: postgres:16
    environment:
      POSTGRES_USER: sonar
      # Solo para este PC: la base no publica ningún puerto, así que no se alcanza desde fuera de este compose.
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      POSTGRES_DB: sonar
    volumes:
      - sonar_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 3s
      retries: 10

  sonarqube:
    # Rolling: siempre la última Community Build. Para fijar una versión, cambia el tag (p. ej. 26.1.0.118079-community).
    image: sonarqube:community
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
    # 127.0.0.1: solo se abre desde este PC. El scanner entra por la red interna (http://sonarqube:9000).
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    # Requisitos de su motor de búsqueda (Elasticsearch).
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc:
        soft: 8192
        hard: 8192

volumes:
  sonar_db:
  sonar_data:
  sonar_extensions:
  sonar_logs:

# Nombre fijo para que el scanner (que corre en un contenedor aparte) se una a la misma red: ver infra/scripts/sonar.sh.
networks:
  default:
    name: master-code-sonar
