name: mobile

# Se filtra por carpeta para que no corra por cambios de otras carpetas.
on:
  push:
    branches: [main, Gutierrez, carlos-junco, gael-lajara]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint, pruebas y APK
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug
