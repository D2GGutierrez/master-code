name: admin-api

# Se filtra por carpeta porque ya no hay chequeos obligatorios: así no corre por cambios de otras carpetas.
on:
  push:
    branches: [main]
    paths:
      - "admin-api/**"
      - ".github/workflows/admin-api.yml"
  pull_request:
    paths:
      - "admin-api/**"
      - ".github/workflows/admin-api.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: admin-api/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check

      # Clave nueva en cada corrida, con el formato del .env (una línea con \n): no hay claves en el repo.
      - name: Clave JWT temporal
        run: echo "JWT_PRIVATE_KEY=$(openssl genrsa -quiet 2048 | awk '{printf "%s\\n", $0}')" >> "$GITHUB_ENV"

      - name: Pruebas
        run: python manage.py test
        # Valores falsos: las pruebas no se conectan a la base.
        env:
          DJANGO_SECRET_KEY: clave-falsa-solo-para-ci
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          DOMINIO_INSTITUCIONAL: ejemplo.edu.pe

      - name: Construir imagen
        run: docker build -t master-code-admin-api .
