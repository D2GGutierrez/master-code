name: ai-service

# Se filtra por carpeta porque ya no hay chequeos obligatorios: así no corre por cambios de otras carpetas.
on:
  push:
    branches: [main, Gutierrez, carlos-junco, gael-lajara]
    paths:
      - "ai-service/**"
      - ".github/workflows/ai-service.yml"
  pull_request:
    paths:
      - "ai-service/**"
      - ".github/workflows/ai-service.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt

      # ruff en la misma versión que admin-api.
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check

      - name: Pruebas
        run: python -m pytest

      - name: Construir imagen
        run: docker build -t master-code-ai-service .
