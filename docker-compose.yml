# Levanta todo el sistema: docker compose up -d
# Dentro de la red los servicios se llaman por su nombre (db, admin-api), no por localhost.
# Cada servicio recibe solo sus variables: la clave privada JWT solo llega a admin-api.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  admin-api:
    build: ./admin-api
    # El Dockerfile solo arranca el servidor: aquí se migra antes, para que la base esté al día.
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      # admin-api: nombre con el que user-api pide el JWKS; sin él Django responde 400.
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,admin-api
      DOMINIO_INSTITUCIONAL: ${DOMINIO_INSTITUCIONAL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      INVITACION_DIAS: ${INVITACION_DIAS:-30}
      # D3: la clave de la API interna la reciben solo admin-api y user-api.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      USER_API_URL: http://user-api:8081
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # db y 5432: dentro de la red no se usa localhost ni el puerto publicado al PC.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  admin-web:
    build: ./admin-web
    environment:
      # El proxy de Vite corre dentro del contenedor: su localhost no es admin-api.
      API_PROXY_TARGET: http://admin-api:8000
    ports:
      - "3000:3000"
    depends_on:
      - admin-api

  user-api:
    build: ./user-api
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # Solo la clave pública, por la red interna (ADR-4).
      JWKS_URI: http://admin-api:8000/.well-known/jwks.json
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # Por la red interna: user-api le pide a ai-service que ejecute el código.
      AI_SERVICE_URL: http://ai-service:8002
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      # Por la red interna: user-api le pregunta a admin-api por los datos de los cursos.
      ADMIN_API_URL: http://admin-api:8000
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  user-web:
    build: ./user-web
    ports:
      - "3001:3001"
    depends_on:
      - user-api

  ai-service:
    build: ./ai-service
    environment:
      # Solo ai-service recibe la clave del LLM. Con mock (por defecto) no hace falta.
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_API_KEY: ${LLM_API_KEY}
      # Motor que ejecuta el código de los estudiantes: mock (por defecto, no ejecuta nada), judge0 o piston.
      # Con mock, docker compose up funciona sin ningún motor. Cambiarlo no toca el código (HU08-T3).
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-mock}
      JUDGE0_URL: http://judge0-server:2358
      PISTON_URL: http://piston:2000
    ports:
      - "8002:8002"

  # Sandbox (HU07): Judge0 ejecuta el código de los estudiantes. Solo ai-service lo llamará (ADR-7 / D1).
  # Tiene su propia base y su propio Redis: no se mezcla con admin_schema ni app_schema (ADR-1).
  # Los límites de tiempo y memoria y el bloqueo de red (HU07-T2) están en el entorno de judge0-server.
  # Requiere un kernel Linux con cgroup v1 (Judge0 1.13.1). En Docker Desktop con WSL2 (cgroup v2)
  # levanta bien pero falla al ejecutar código ("Cannot run proxy, clone failed"): probarlo en Linux.
  judge0-db:
    image: postgres:16
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD}
    volumes:
      - judge0_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0 -d judge0"]
      interval: 5s
      timeout: 3s
      retries: 10

  judge0-redis:
    image: redis:7.2
    # La contraseña va en el comando para que Redis no acepte conexiones sin ella.
    command: ["sh", "-c", "exec redis-server --appendonly no --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  judge0-server:
    # Versión fija, no latest: así el compose se comporta igual en las tres máquinas.
    image: judge0/judge0:1.13.1
    command: ["./scripts/server"]
    environment: &judge0-env
      POSTGRES_HOST: judge0-db
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD}
      REDIS_HOST: judge0-redis
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD}
      # HU07-T2: límites de cada ejecución (código escrito por estudiantes, no confiable). Cada
      # MAX_* es igual a su valor por defecto: así un cliente tampoco puede pedir más en su envío.
      # Tiempo de CPU en segundos: corta un bucle infinito.
      CPU_TIME_LIMIT: "5"
      MAX_CPU_TIME_LIMIT: "5"
      # Tiempo total en segundos: corta también los programas que se quedan esperando sin gastar CPU.
      WALL_TIME_LIMIT: "10"
      MAX_WALL_TIME_LIMIT: "10"
      # Memoria en KB (256 MB: Java arranca una JVM, con menos falla aunque el programa sea mínimo).
      MEMORY_LIMIT: "256000"
      MAX_MEMORY_LIMIT: "256000"
      STACK_LIMIT: "64000"
      MAX_STACK_LIMIT: "64000"
      # Procesos e hilos: frena una bomba de procesos (fork bomb).
      MAX_PROCESSES_AND_OR_THREADS: "60"
      MAX_MAX_PROCESSES_AND_OR_THREADS: "60"
      # Tamaño máximo de un archivo que escriba el programa, en KB.
      MAX_FILE_SIZE: "1024"
      MAX_MAX_FILE_SIZE: "1024"
      # Sin red: el programa no puede abrir conexiones. ALLOW_... en false impide además que un
      # envío lo vuelva a activar con enable_network.
      ENABLE_NETWORK: "false"
      ALLOW_ENABLE_NETWORK: "false"
    ports:
      # Solo en este PC (127.0.0.1) para probarlo a mano; entre servicios se usa http://judge0-server:2358.
      - "127.0.0.1:2358:2358"
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy

  judge0-worker:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    environment: *judge0-env
    # Solo el worker lo necesita: aísla cada programa con mecanismos del kernel (isolate / cgroups).
    privileged: true
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy

  # Sandbox alternativo (HU08-T2). No arranca con un docker compose up normal: se pide con
  #   docker compose --profile piston up -d piston
  # A diferencia de Judge0 1.13.1, Piston pide cgroup v2 (el de Docker Desktop con WSL2).
  # Los lenguajes se instalan una vez, ver docs/piston.md.
  piston:
    image: ghcr.io/engineer-man/piston
    profiles: ["piston"]
    # Aísla cada programa con mecanismos del kernel: sin esto no puede crear su entorno.
    privileged: true
    tmpfs:
      - /tmp:exec
    ports:
      # Solo en este PC (127.0.0.1), para instalar lenguajes y probar a mano; ai-service usa http://piston:2000.
      - "127.0.0.1:2000:2000"
    volumes:
      - piston_packages:/piston/packages
    environment:
      # Límites de cada ejecución (HU07-T2 pide lo mismo para Judge0): código de estudiantes, no confiable.
      # Tiempo en milisegundos: corta un bucle infinito.
      PISTON_RUN_TIMEOUT: "5000"
      PISTON_COMPILE_TIMEOUT: "10000"
      # Memoria en bytes (256 MB).
      PISTON_RUN_MEMORY_LIMIT: "268435456"
      PISTON_COMPILE_MEMORY_LIMIT: "268435456"
      # Procesos por ejecución: frena una bomba de procesos (fork bomb).
      PISTON_MAX_PROCESS_COUNT: "64"
      # Sin red: el programa no puede abrir conexiones. Es el valor por defecto; se deja escrito a propósito.
      PISTON_DISABLE_NETWORKING: "true"

volumes:
  db_data:
  judge0_db_data:
  piston_packages:
