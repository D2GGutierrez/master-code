# Análisis de SonarQube del monorepo completo como un solo proyecto (guía: docs/sonarqube.md).
# Cada carpeta se analiza con el analizador de su lenguaje: Python (admin-api, ai-service), Java (user-api),
# TypeScript y JavaScript (user-web, admin-web) y Kotlin (mobile). Se corre con `make sonar`.
sonar.projectKey=master-code
sonar.projectName=MASTER CODE
sonar.sourceEncoding=UTF-8

# --- Código del producto ---
sonar.sources=admin-api,\
  ai-service/app,ai-service/scripts,\
  user-api/src/main,\
  admin-web/src,user-web/src,\
  mobile/app/src/main

# --- Pruebas ---
# Son las mismas carpetas que arriba en Python y React (las pruebas viven junto al código): lo que decide si un archivo
# es prueba o código son sonar.test.inclusions y sonar.exclusions, que se corresponden entre sí para que ningún archivo
# cuente como las dos cosas.
sonar.tests=admin-api,\
  ai-service/tests,\
  user-api/src/test,\
  user-web/src,\
  mobile/app/src/test
sonar.test.inclusions=**/test_*.py,**/tests.py,ai-service/tests/**,\
  user-api/src/test/**,\
  **/*.test.ts,**/*.test.tsx,\
  mobile/app/src/test/**

# --- Lo que no se analiza ---
# Dependencias, compilados y código generado. Las migraciones de Django las genera `makemigrations`: no se revisan a mano.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/target/**,**/.venv/**,**/__pycache__/**,\
  admin-api/**/migrations/**,\
  **/test_*.py,**/tests.py,**/*.test.ts,**/*.test.tsx

# --- Lenguajes ---
sonar.python.version=3.12

# Java necesita las clases compiladas: `make sonar` las genera antes (infra/scripts/sonar.sh).
sonar.java.binaries=user-api/target/classes
sonar.java.test.binaries=user-api/target/test-classes
sonar.java.libraries=user-api/target/dependency/*.jar
# Las pruebas usan las mismas bibliotecas (más JUnit y Mockito, que también quedan en target/dependency):
# sin esto Sonar avisa «Missing sonar.java.test.libraries» y analiza las pruebas con menos precisión.
sonar.java.test.libraries=user-api/target/dependency/*.jar

sonar.typescript.tsconfigPaths=user-web/tsconfig.app.json,user-web/tsconfig.node.json
